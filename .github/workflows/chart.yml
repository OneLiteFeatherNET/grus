name: chart

# Helm chart checks: lint, render and validate the rendered manifests against the Kubernetes schemas.
# None of them needs a cluster.

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/chart.yml"
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/chart.yml"

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint the chart
        run: helm lint deploy/helm/grus -f deploy/helm/grus/ci/lint-values.yaml

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate the rendered manifests
        run: helm template grus deploy/helm/grus -f deploy/helm/grus/ci/lint-values.yaml | kubeconform -strict -ignore-missing-schemas -summary
