name: cli

# Release binaries of the Grus command line tools with GoReleaser (see .goreleaser.yaml).
# - Pull requests and main: build a snapshot and keep the archives as workflow artifacts.
# - Release: release-please.yml calls this workflow with the new tag, because a tag created with
#   GITHUB_TOKEN starts no workflow of its own. The assets are attached to the existing release.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish, for example v1.2.3
        type: string
        required: true

permissions:
  contents: read

jobs:
  snapshot:
    name: Snapshot
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build the snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Upload the archives
        uses: actions/upload-artifact@v7
        with:
          name: grus-cli-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          if-no-files-found: error

  release:
    name: Release
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Publish the release assets
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
