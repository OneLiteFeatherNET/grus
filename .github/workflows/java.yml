name: java

# Gradle build of the Java modules (SDK, Velocity plugin, Minestom demo) under java/.

on:
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java.yml"
  push:
    branches: [main]
    paths:
      - "java/**"
      - ".github/workflows/java.yml"

permissions:
  contents: read

jobs:
  gradle:
    name: Gradle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --max-workers=2
