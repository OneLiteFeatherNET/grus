name: prototype-images

# Manual prototype images for the feather-core deployment. Tags are prototype-<short sha>; releases are
# not involved, so this does not wait for release-please. The controller image is built from the root
# Dockerfile, the Velocity and Minestom images from the Docker contexts that Gradle writes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Derive the prototype tag
        id: tag
        run: echo "tag=prototype-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  grus:
    name: Controller image
    needs: meta
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/grus"
      version: ${{ needs.meta.outputs.tag }}
      context: "."
      dockerfile: "Dockerfile"
    secrets: inherit

  java-context:
    name: Java Docker contexts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write the Docker contexts
        run: ./gradlew :grus-velocity:dockerContext :grus-demo-minestom:dockerContext --max-workers=2

      - name: Upload the Velocity context
        uses: actions/upload-artifact@v7
        with:
          name: velocity-context
          path: java/grus-velocity/build/docker-context
          include-hidden-files: false
          if-no-files-found: error

      - name: Upload the Minestom demo context
        uses: actions/upload-artifact@v7
        with:
          name: demo-minestom-context
          path: java/grus-demo-minestom/build/docker-context
          include-hidden-files: false
          if-no-files-found: error

  velocity:
    name: Velocity image
    needs: [meta, java-context]
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/grus-velocity"
      version: ${{ needs.meta.outputs.tag }}
      context: "docker-context"
      dockerfile: "docker-context/Dockerfile"
      artifact-name: "velocity-context"
    secrets: inherit

  demo-minestom:
    name: Minestom demo image
    needs: [meta, java-context]
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/grus-demo-minestom"
      version: ${{ needs.meta.outputs.tag }}
      context: "docker-context"
      dockerfile: "docker-context/Dockerfile"
      artifact-name: "demo-minestom-context"
    secrets: inherit
