# Namespace-scoped only: the controller manages instance pods in its own namespace and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "grus.fullname" . }}
  labels:
    {{- include "grus.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "get"]
  # Instance tokens are stored as Secrets; the controller creates and deletes them, it never lists them.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  {{- if .Values.crds.watch }}
  # Custom resources of this namespace only: the controller reads them and reports the status of pools.
  - apiGroups: ["grus.onelitefeather.net"]
    resources: ["environments", "groups", "pools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["grus.onelitefeather.net"]
    resources: ["environments/status", "groups/status", "pools/status"]
    verbs: ["get", "update", "patch"]
  {{- end }}
