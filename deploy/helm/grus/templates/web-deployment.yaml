{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grus.web.fullname" . }}
  labels:
    {{- include "grus.web.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "grus.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grus.web.selectorLabels" . | nindent 8 }}
    spec:
      # The web UI talks to the controller through its HTTP API and needs no Kubernetes API token.
      automountServiceAccountToken: false
      {{- with (.Values.web.imagePullSecrets | default .Values.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "grus.podSecurity" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "grus.web.image" . }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NUXT_GRUS_API_URL
              value: {{ printf "http://%s:%d" (include "grus.fullname" .) (int .Values.service.port) | quote }}
            - name: NUXT_GRUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "adminToken.existingSecret is required: name an existing Secret that holds the admin token" .Values.adminToken.existingSecret }}
                  key: {{ .Values.adminToken.key | quote }}
            {{- range $name, $value := .Values.web.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- include "grus.containerSecurity" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
{{- end }}
