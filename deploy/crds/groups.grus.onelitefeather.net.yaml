apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: groups.grus.onelitefeather.net
spec:
  group: grus.onelitefeather.net
  scope: Namespaced
  names:
    kind: Group
    listKind: GroupList
    plural: groups
    singular: group
    shortNames: [ggroup]
    categories: [grus]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Templates
          type: string
          jsonPath: .spec.templates[*].name
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: Templates, env and labels shared by many pools.
          required: [spec]
          properties:
            spec:
              type: object
              properties:
                templates:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      tag: {type: string}
                      digest: {type: string}
                env:
                  type: object
                  additionalProperties: {type: string}
                labels:
                  type: object
                  additionalProperties: {type: string}
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
