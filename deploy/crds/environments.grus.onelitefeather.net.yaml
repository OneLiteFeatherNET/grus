apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: environments.grus.onelitefeather.net
spec:
  group: grus.onelitefeather.net
  scope: Namespaced
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
    shortNames: [genv]
    categories: [grus]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Port
          type: integer
          jsonPath: .spec.port
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: How a Grus service runs, independent of what it serves.
          required: [spec]
          properties:
            spec:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [jvm, native, container]
                image:
                  type: string
                command:
                  type: array
                  items: {type: string}
                args:
                  type: array
                  items: {type: string}
                jvm:
                  type: object
                  properties:
                    jar:
                      type: string
                    flags:
                      type: array
                      items: {type: string}
                env:
                  type: object
                  additionalProperties: {type: string}
                port:
                  type: integer
                  minimum: 0
                  maximum: 65535
                readiness:
                  type: string
                  enum: [self, tcp]
                stopCommand:
                  type: string
                gracePeriod:
                  type: string
                  description: Go duration such as 30s.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
