components:
  schemas:
    CommandBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CommandBody.json
          format: uri
          readOnly: true
          type: string
        line:
          description: Console line sent to the instance
          minLength: 1
          type: string
      required:
        - line
      type: object
    CreateInstanceBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateInstanceBody.json
          format: uri
          readOnly: true
          type: string
        pool:
          description: Pool that gets the new instance
          minLength: 1
          type: string
      required:
        - pool
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Instance:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Instance.json
          format: uri
          readOnly: true
          type: string
        address:
          type: string
        allocatedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        driverRef:
          type: string
        host:
          type: string
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lastHeartbeat:
          format: date-time
          type: string
        maxPlayers:
          format: int64
          type: integer
        players:
          format: int64
          type: integer
        pool:
          type: string
        poolGeneration:
          format: int64
          type: integer
        role:
          type: string
        state:
          type: string
        stateReason:
          type: string
        stateSince:
          format: date-time
          type: string
      required:
        - id
        - pool
        - role
        - poolGeneration
        - host
        - state
        - stateSince
        - players
        - maxPlayers
        - createdAt
      type: object
    Lifecycle:
      additionalProperties: false
      properties:
        gracePeriod:
          type: string
        heartbeatTimeout:
          type: string
        startTimeout:
          type: string
        stopCommand:
          type: string
      type: object
    MaintenanceBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MaintenanceBody.json
          format: uri
          readOnly: true
          type: string
        enabled:
          type: boolean
      required:
        - enabled
      type: object
    Pool:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Pool.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        generation:
          format: int64
          type: integer
        maintenance:
          type: boolean
        name:
          type: string
        spec:
          $ref: "#/components/schemas/PoolSpec"
        updatedAt:
          format: date-time
          type: string
      required:
        - name
        - spec
        - generation
        - maintenance
        - createdAt
        - updatedAt
      type: object
    PoolSpec:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PoolSpec.json
          format: uri
          readOnly: true
          type: string
        args:
          items:
            type: string
          type:
            - array
            - "null"
        command:
          items:
            type: string
          type:
            - array
            - "null"
        driver:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lifecycle:
          $ref: "#/components/schemas/Lifecycle"
        mode:
          type: string
        port:
          format: int64
          type: integer
        priorityClassName:
          type: string
        resources:
          $ref: "#/components/schemas/Resources"
        role:
          type: string
        scaling:
          $ref: "#/components/schemas/Scaling"
        secretEnv:
          items:
            $ref: "#/components/schemas/SecretRef"
          type:
            - array
            - "null"
        templates:
          items:
            $ref: "#/components/schemas/TemplateRef"
          type:
            - array
            - "null"
      required:
        - role
        - mode
        - driver
        - resources
        - scaling
      type: object
    Resources:
      additionalProperties: false
      properties:
        cpu:
          type: string
        memoryMiB:
          format: int64
          type: integer
      required:
        - memoryMiB
      type: object
    Scaling:
      additionalProperties: false
      properties:
        buffer:
          format: int64
          type: integer
        capacity:
          format: int64
          type: integer
        drainTimeout:
          type: string
        max:
          format: int64
          type: integer
        maxSurge:
          format: int64
          type: integer
        min:
          format: int64
          type: integer
        scaleDownDelay:
          type: string
        targetUtilization:
          format: double
          type: number
      required:
        - min
        - max
      type: object
    SecretRef:
      additionalProperties: false
      properties:
        key:
          type: string
        name:
          type: string
        secret:
          type: string
      required:
        - name
        - secret
        - key
      type: object
    StatusUpdate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StatusUpdate.json
          format: uri
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        maxPlayers:
          format: int64
          type: integer
        players:
          format: int64
          type: integer
      required:
        - players
        - maxPlayers
      type: object
    StopOptions:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StopOptions.json
          format: uri
          readOnly: true
          type: string
        drain:
          type: boolean
        force:
          type: boolean
      type: object
    TagBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TagBody.json
          format: uri
          readOnly: true
          type: string
        digest:
          description: Digest of an existing version
          pattern: ^sha256:[0-9a-f]+$
          type: string
      required:
        - digest
      type: object
    TemplateRef:
      additionalProperties: false
      properties:
        digest:
          type: string
        name:
          type: string
        tag:
          type: string
      required:
        - name
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  title: Grus API
  version: 1.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: process is alive
      summary: Liveness
  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: ready
        "503":
          content:
            text/plain:
              schema:
                type: string
          description: not ready
      summary: Readiness
  /v1/events:
    get:
      description: Each event has an `event:` type, an `id:` sequence and JSON `data:`. Resume with `Last-Event-ID`.
      operationId: stream-events
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: event stream
        "401":
          content:
            application/problem+json:
              schema:
                type: object
          description: missing or invalid bearer token
        "403":
          content:
            application/problem+json:
              schema:
                type: object
          description: token lacks the required scope
      security:
        - bearer: []
      summary: Event stream (server-sent events)
  /v1/instances:
    get:
      operationId: list-instances
      parameters:
        - description: Only instances of this pool
          explode: false
          in: query
          name: pool
          schema:
            description: Only instances of this pool
            type: string
        - description: Only instances in this lifecycle state
          explode: false
          in: query
          name: state
          schema:
            description: Only instances in this lifecycle state
            type: string
        - description: Only instances with this role
          explode: false
          in: query
          name: role
          schema:
            description: Only instances with this role
            enum:
              - proxy
              - game
              - other
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Instance"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List instances, optionally filtered by pool, state and role
    post:
      operationId: create-instance
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstanceBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Add an instance to a pool
  /v1/instances/{id}:
    get:
      operationId: get-instance
      parameters:
        - description: Instance id
          in: path
          name: id
          required: true
          schema:
            description: Instance id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get an instance
  /v1/instances/{id}/command:
    post:
      operationId: send-instance-command
      parameters:
        - description: Instance id
          in: path
          name: id
          required: true
          schema:
            description: Instance id
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Send a console command
  /v1/instances/{id}/logs:
    get:
      operationId: get-instance-logs
      parameters:
        - description: Instance id
          in: path
          name: id
          required: true
          schema:
            description: Instance id
            type: string
        - description: Number of trailing lines
          explode: false
          in: query
          name: tail
          schema:
            default: 200
            description: Number of trailing lines
            format: int64
            maximum: 5000
            minimum: 1
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Read the last lines of an instance log as text/plain
  /v1/instances/{id}/logs/stream:
    get:
      description: Each log line is sent as one `data:` event.
      operationId: stream-instance-logs
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: log stream
        "401":
          content:
            application/problem+json:
              schema:
                type: object
          description: missing or invalid bearer token
        "403":
          content:
            application/problem+json:
              schema:
                type: object
          description: token lacks the required scope
        "404":
          content:
            application/problem+json:
              schema:
                type: object
          description: instance not found
      security:
        - bearer: []
      summary: Follow an instance log as server-sent events
  /v1/instances/{id}/stop:
    post:
      operationId: stop-instance
      parameters:
        - description: Instance id
          in: path
          name: id
          required: true
          schema:
            description: Instance id
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopOptions"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Stop an instance; with players it needs drain or force
  /v1/pools:
    get:
      operationId: list-pools
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Pool"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List pools
  /v1/pools/{pool}:
    delete:
      operationId: delete-pool
      parameters:
        - description: Pool name
          in: path
          name: pool
          required: true
          schema:
            description: Pool name
            type: string
        - description: Drain the instances before the pool is removed
          explode: false
          in: query
          name: drain
          schema:
            description: Drain the instances before the pool is removed
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Delete a pool
    get:
      operationId: get-pool
      parameters:
        - description: Pool name
          in: path
          name: pool
          required: true
          schema:
            description: Pool name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a pool
    put:
      description: Idempotent. Generation increases when the spec changes.
      operationId: put-pool
      parameters:
        - description: Pool name
          in: path
          name: pool
          required: true
          schema:
            description: Pool name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolSpec"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create or replace a pool
  /v1/pools/{pool}/maintenance:
    put:
      operationId: set-pool-maintenance
      parameters:
        - description: Pool name
          in: path
          name: pool
          required: true
          schema:
            description: Pool name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Enable or disable maintenance for a pool
  /v1/self:
    get:
      operationId: get-self
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get the calling instance
  /v1/self/allocate:
    post:
      operationId: self-allocate
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Mark the calling instance as allocated
  /v1/self/ready:
    post:
      operationId: self-ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Report that the calling instance is ready
  /v1/self/shutdown:
    post:
      operationId: self-shutdown
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Ask the controller to shut the calling instance down
  /v1/self/status:
    put:
      operationId: self-status
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Report players and labels; counts as heartbeat
  /v1/templates:
    get:
      operationId: list-templates
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  additionalProperties:
                    type: string
                  type: object
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List templates with their tags (tag -> digest)
  /v1/templates/{name}/tags/{tag}:
    put:
      operationId: tag-template
      parameters:
        - description: Template name
          in: path
          name: name
          required: true
          schema:
            description: Template name
            type: string
        - description: Tag to point at the digest
          in: path
          name: tag
          required: true
          schema:
            description: Tag to point at the digest
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Point a tag at a version
  /v1/templates/{name}/versions:
    post:
      description: Request body is a tar.gz archive of at most 256 MiB.
      operationId: upload-template-version
      requestBody:
        content:
          application/gzip:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
          description: version stored
        "401":
          content:
            application/problem+json:
              schema:
                type: object
          description: missing or invalid bearer token
        "403":
          content:
            application/problem+json:
              schema:
                type: object
          description: token lacks the required scope
        "413":
          content:
            application/problem+json:
              schema:
                type: object
          description: archive larger than 256 MiB
      security:
        - bearer: []
      summary: Store a template version
  /v1/templates/{name}/versions/{digest}/archive:
    get:
      operationId: get-template-archive
      parameters:
        - description: Template name
          in: path
          name: name
          required: true
          schema:
            description: Template name
            type: string
        - description: Version digest, e.g. sha256:<hex>
          in: path
          name: digest
          required: true
          schema:
            description: Version digest, e.g. sha256:<hex>
            pattern: ^sha256:[0-9a-f]+$
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Download a template version as tar.gz
