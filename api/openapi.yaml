components:
  schemas:
    Capacity:
      additionalProperties: false
      properties:
        memoryMiB:
          description: Memory available for instances
          format: int64
          type: integer
      type: object
    Cell:
      additionalProperties: false
      properties:
        maxX:
          description: Largest chunk x of the cell
          format: int64
          type: integer
        maxZ:
          description: Largest chunk z of the cell
          format: int64
          type: integer
        minX:
          description: Smallest chunk x of the cell
          format: int64
          type: integer
        minZ:
          description: Smallest chunk z of the cell
          format: int64
          type: integer
        name:
          description: Cell name; assigned to exactly one Ready instance
          type: string
      required:
        - name
        - minX
        - minZ
        - maxX
        - maxZ
      type: object
    CellBounds:
      additionalProperties: false
      properties:
        maxX:
          format: int64
          type: integer
        maxZ:
          format: int64
          type: integer
        minX:
          format: int64
          type: integer
        minZ:
          format: int64
          type: integer
      required:
        - minX
        - minZ
        - maxX
        - maxZ
      type: object
    CellInfo:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CellInfo.json
          format: uri
          readOnly: true
          type: string
        address:
          type: string
        bounds:
          $ref: "#/components/schemas/CellBounds"
        cell:
          type: string
        instance:
          type: string
      required:
        - cell
        - bounds
      type: object
    Command:
      additionalProperties: false
      properties:
        instance:
          type: string
        line:
          type: string
        seq:
          format: int64
          type: integer
      required:
        - seq
        - instance
        - line
      type: object
    CommandBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CommandBody.json
          format: uri
          readOnly: true
          type: string
        line:
          description: Console line sent to the instance
          minLength: 1
          type: string
      required:
        - line
      type: object
    CreateInstanceBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateInstanceBody.json
          format: uri
          readOnly: true
          type: string
        pool:
          description: Pool that gets the new instance
          minLength: 1
          type: string
      required:
        - pool
      type: object
    Desired:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Desired.json
          format: uri
          readOnly: true
          type: string
        commands:
          items:
            $ref: "#/components/schemas/Command"
          type:
            - array
            - "null"
        instances:
          items:
            $ref: "#/components/schemas/DesiredInstance"
          type:
            - array
            - "null"
        revision:
          description: Changes whenever the desired state changes
          format: int64
          type: integer
      required:
        - revision
        - instances
        - commands
      type: object
    DesiredInstance:
      additionalProperties: false
      properties:
        effective:
          $ref: "#/components/schemas/EffectiveSpec"
        env:
          additionalProperties:
            type: string
          description: Environment of the instance as the controller built it; the agent overrides GRUS_URL
          type: object
        generation:
          format: int64
          type: integer
        id:
          type: string
        kill:
          description: Kill the instance and forget it
          type: boolean
        memoryMiB:
          format: int64
          type: integer
        mode:
          type: string
        pool:
          type: string
        role:
          type: string
        stop:
          $ref: "#/components/schemas/StopRequest"
        templates:
          items:
            $ref: "#/components/schemas/TemplateVersion"
          type:
            - array
            - "null"
        token:
          description: Plain per-instance token for GRUS_TOKEN
          type: string
        tokenHash:
          type: string
      required:
        - id
        - pool
        - role
        - mode
        - generation
        - effective
        - stop
      type: object
    EffectiveSpec:
      additionalProperties: false
      properties:
        args:
          items:
            type: string
          type:
            - array
            - "null"
        command:
          items:
            type: string
          type:
            - array
            - "null"
        driver:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        gracePeriod:
          type: string
        host:
          type: string
        image:
          type: string
        kind:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        port:
          format: int64
          type: integer
        readiness:
          type: string
        stopCommand:
          type: string
        templates:
          items:
            $ref: "#/components/schemas/TemplateRef"
          type:
            - array
            - "null"
      required:
        - driver
        - port
        - readiness
        - gracePeriod
      type: object
    Environment:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Environment.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        generation:
          format: int64
          type: integer
        name:
          type: string
        source:
          type: string
        spec:
          $ref: "#/components/schemas/EnvironmentSpec"
        updatedAt:
          format: date-time
          type: string
      required:
        - name
        - spec
        - source
        - generation
        - createdAt
        - updatedAt
      type: object
    EnvironmentSpec:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnvironmentSpec.json
          format: uri
          readOnly: true
          type: string
        args:
          items:
            type: string
          type:
            - array
            - "null"
        command:
          items:
            type: string
          type:
            - array
            - "null"
        env:
          additionalProperties:
            type: string
          type: object
        gracePeriod:
          type: string
        image:
          type: string
        jvm:
          $ref: "#/components/schemas/JVM"
        kind:
          type: string
        port:
          format: int64
          type: integer
        readiness:
          type: string
        stopCommand:
          type: string
      required:
        - kind
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Group:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Group.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        generation:
          format: int64
          type: integer
        name:
          type: string
        source:
          type: string
        spec:
          $ref: "#/components/schemas/GroupSpec"
        updatedAt:
          format: date-time
          type: string
      required:
        - name
        - spec
        - source
        - generation
        - createdAt
        - updatedAt
      type: object
    GroupSpec:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GroupSpec.json
          format: uri
          readOnly: true
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        labels:
          additionalProperties:
            type: string
          type: object
        templates:
          items:
            $ref: "#/components/schemas/TemplateRef"
          type:
            - array
            - "null"
      type: object
    HostInfo:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HostInfo.json
          format: uri
          readOnly: true
          type: string
        address:
          type: string
        capacity:
          $ref: "#/components/schemas/Capacity"
        instances:
          description: Instances the agent reported
          format: int64
          type: integer
        labels:
          additionalProperties:
            type: string
          type: object
        lastSeen:
          description: Last contact of the agent; absent when it never connected
          format: date-time
          type: string
        name:
          type: string
        online:
          type: boolean
        portRange:
          type: string
        version:
          type: string
      required:
        - name
        - online
        - instances
      type: object
    Instance:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Instance.json
          format: uri
          readOnly: true
          type: string
        address:
          type: string
        allocatedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        driverRef:
          type: string
        host:
          type: string
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lastHeartbeat:
          format: date-time
          type: string
        maxPlayers:
          format: int64
          type: integer
        players:
          format: int64
          type: integer
        pool:
          type: string
        poolGeneration:
          format: int64
          type: integer
        role:
          type: string
        state:
          type: string
        stateReason:
          type: string
        stateSince:
          format: date-time
          type: string
      required:
        - id
        - pool
        - role
        - poolGeneration
        - host
        - state
        - stateSince
        - players
        - maxPlayers
        - createdAt
      type: object
    JVM:
      additionalProperties: false
      properties:
        flags:
          description: JVM flags placed before -Xmx and -jar
          items:
            type: string
          type:
            - array
            - "null"
        jar:
          description: Jar file inside the instance directory
          type: string
      type: object
    Lifecycle:
      additionalProperties: false
      properties:
        gracePeriod:
          type: string
        heartbeatTimeout:
          type: string
        startTimeout:
          type: string
        stopCommand:
          type: string
      type: object
    MaintenanceBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MaintenanceBody.json
          format: uri
          readOnly: true
          type: string
        enabled:
          type: boolean
      required:
        - enabled
      type: object
    NetworkStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/NetworkStatus.json
          format: uri
          readOnly: true
          type: string
        maxPlayers:
          format: int64
          type: integer
        players:
          format: int64
          type: integer
        proxies:
          format: int64
          type: integer
      required:
        - players
        - maxPlayers
        - proxies
      type: object
    ObservedInstance:
      additionalProperties: false
      properties:
        address:
          type: string
        generation:
          format: int64
          type: integer
        id:
          type: string
        mode:
          type: string
        phase:
          type: string
        pool:
          type: string
        reason:
          type: string
        role:
          type: string
        startedAt:
          format: date-time
          type: string
        tokenHash:
          type: string
      required:
        - id
        - phase
      type: object
    ObservedReport:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ObservedReport.json
          format: uri
          readOnly: true
          type: string
        commandSeq:
          description: Highest console command sequence number the agent has applied
          format: int64
          type: integer
        instances:
          items:
            $ref: "#/components/schemas/ObservedInstance"
          type:
            - array
            - "null"
        logs:
          additionalProperties:
            items:
              type: string
            type:
              - array
              - "null"
          description: Last console lines per instance id
          type: object
        revision:
          description: Desired revision the agent has applied before this report
          format: int64
          type: integer
      required:
        - revision
        - instances
      type: object
    Placement:
      additionalProperties: false
      properties:
        driver:
          type: string
        host:
          type: string
      type: object
    Pool:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Pool.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        generation:
          format: int64
          type: integer
        maintenance:
          type: boolean
        name:
          type: string
        source:
          type: string
        spec:
          $ref: "#/components/schemas/PoolSpec"
        updatedAt:
          format: date-time
          type: string
      required:
        - name
        - spec
        - generation
        - maintenance
        - createdAt
        - updatedAt
      type: object
    PoolSpec:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PoolSpec.json
          format: uri
          readOnly: true
          type: string
        args:
          items:
            type: string
          type:
            - array
            - "null"
        command:
          items:
            type: string
          type:
            - array
            - "null"
        driver:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        environment:
          type: string
        groups:
          items:
            type: string
          type:
            - array
            - "null"
        image:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lifecycle:
          $ref: "#/components/schemas/Lifecycle"
        mode:
          type: string
        placement:
          $ref: "#/components/schemas/Placement"
        port:
          format: int64
          type: integer
        priorityClassName:
          type: string
        private:
          $ref: "#/components/schemas/Private"
        resources:
          $ref: "#/components/schemas/Resources"
        role:
          type: string
        scaling:
          $ref: "#/components/schemas/Scaling"
        secretEnv:
          items:
            $ref: "#/components/schemas/SecretRef"
          type:
            - array
            - "null"
        sharding:
          $ref: "#/components/schemas/Sharding"
        templates:
          items:
            $ref: "#/components/schemas/TemplateRef"
          type:
            - array
            - "null"
      required:
        - role
        - mode
        - resources
        - scaling
      type: object
    Private:
      additionalProperties: false
      properties:
        idleTimeout:
          description: Stop an instance after this long without players (default 10m)
          type: string
        quotaPerOwner:
          description: Instances one owner may have at once (default 1)
          format: int64
          type: integer
      type: object
    PrivateServerBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PrivateServerBody.json
          format: uri
          readOnly: true
          type: string
        owner:
          description: Owner of the server, e.g. a player uuid
          maxLength: 63
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          type: string
        pool:
          description: Private pool (a pool with a private section)
          minLength: 1
          type: string
      required:
        - pool
        - owner
      type: object
    RegisterRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RegisterRequest.json
          format: uri
          readOnly: true
          type: string
        address:
          description: IP address proxies use to reach instances on this host
          type: string
        capacity:
          $ref: "#/components/schemas/Capacity"
        labels:
          additionalProperties:
            type: string
          description: Free host labels
          type: object
        portRange:
          description: Instance port range, e.g. 30000-30100
          type: string
        version:
          description: Agent version
          type: string
      type: object
    Resources:
      additionalProperties: false
      properties:
        cpu:
          type: string
        memoryMiB:
          format: int64
          type: integer
      required:
        - memoryMiB
      type: object
    Scaling:
      additionalProperties: false
      properties:
        buffer:
          format: int64
          type: integer
        capacity:
          format: int64
          type: integer
        drainTimeout:
          type: string
        max:
          format: int64
          type: integer
        maxSurge:
          format: int64
          type: integer
        min:
          format: int64
          type: integer
        scaleDownDelay:
          type: string
        targetUtilization:
          format: double
          type: number
      required:
        - min
        - max
      type: object
    SecretRef:
      additionalProperties: false
      properties:
        key:
          type: string
        name:
          type: string
        secret:
          type: string
      required:
        - name
        - secret
        - key
      type: object
    Sharding:
      additionalProperties: false
      properties:
        cellSize:
          description: Cell edge length in chunks, used when cells are generated (default 32)
          format: int64
          type: integer
        cells:
          description: Static cell list; bounds are chunk coordinates
          items:
            $ref: "#/components/schemas/Cell"
          type:
            - array
            - "null"
      type: object
    StatusUpdate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StatusUpdate.json
          format: uri
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        maxPlayers:
          format: int64
          type: integer
        players:
          format: int64
          type: integer
      required:
        - players
        - maxPlayers
      type: object
    StopOptions:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StopOptions.json
          format: uri
          readOnly: true
          type: string
        drain:
          type: boolean
        force:
          type: boolean
      type: object
    StopRequest:
      additionalProperties: false
      properties:
        command:
          description: Console line that triggers a clean shutdown
          type: string
        graceSeconds:
          description: Time before the agent sends SIGTERM
          format: int64
          type: integer
        requested:
          type: boolean
      required:
        - requested
      type: object
    TagBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TagBody.json
          format: uri
          readOnly: true
          type: string
        digest:
          description: Digest of an existing version
          pattern: ^sha256:[0-9a-f]+$
          type: string
      required:
        - digest
      type: object
    TemplateRef:
      additionalProperties: false
      properties:
        digest:
          type: string
        name:
          type: string
        tag:
          type: string
      required:
        - name
      type: object
    TemplateVersion:
      additionalProperties: false
      properties:
        digest:
          type: string
        name:
          type: string
      required:
        - name
        - digest
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  title: Grus API
  version: 1.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: process is alive
      summary: Liveness
  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: ready
        "503":
          content:
            text/plain:
              schema:
                type: string
          description: not ready
      summary: Readiness
  /v1/agents/{host}:
    put:
      operationId: register-agent
      parameters:
        - description: Agent host name
          in: path
          name: host
          required: true
          schema:
            description: Agent host name
            pattern: ^[a-z0-9][a-z0-9._-]{0,62}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Register an agent host or send its heartbeat
  /v1/agents/{host}/desired:
    get:
      operationId: get-agent-desired
      parameters:
        - description: Agent host name
          in: path
          name: host
          required: true
          schema:
            description: Agent host name
            pattern: ^[a-z0-9][a-z0-9._-]{0,62}$
            type: string
        - description: How long the request may wait for a change, as a duration (max 60s)
          explode: false
          in: query
          name: wait
          schema:
            default: 25s
            description: How long the request may wait for a change, as a duration (max 60s)
            type: string
        - description: Revision the agent already has; the call returns at once when it differs
          explode: false
          in: query
          name: revision
          schema:
            default: -1
            description: Revision the agent already has; the call returns at once when it differs
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Desired"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Long-poll the desired state of an agent host
  /v1/agents/{host}/observed:
    put:
      operationId: put-agent-observed
      parameters:
        - description: Agent host name
          in: path
          name: host
          required: true
          schema:
            description: Agent host name
            pattern: ^[a-z0-9][a-z0-9._-]{0,62}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservedReport"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
